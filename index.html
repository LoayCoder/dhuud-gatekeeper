    <!-- PWA Standalone Mode Detection CSS -->
    <style>
      /* Hide address bar UI when running as installed PWA */
      @media all and (display-mode: standalone) {
        body {
          /* Ensure content doesn't overlap with notch/status bar */
          padding-top: env(safe-area-inset-top);
          padding-bottom: env(safe-area-inset-bottom);
          padding-left: env(safe-area-inset-left);
          padding-right: env(safe-area-inset-right);
        }

  <body>
    <!-- Fallback Error UI - Shows if React fails to load -->
    <div id="app-load-fallback" style="display: none;">
      <style>
        #app-load-fallback {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: linear-gradient(135deg, #1e3a5f 0%, #0f172a 100%);
          color: white;
          font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
          text-align: center;
          padding: 2rem;
          z-index: 9999;
        }
        #app-load-fallback .fallback-icon {
          font-size: 4rem;
          margin-bottom: 1rem;
          animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.6; }
        }
        #app-load-fallback h1 {
          font-size: 1.5rem;
          font-weight: 600;
          margin: 0 0 0.5rem 0;
        }
        #app-load-fallback p {
          opacity: 0.8;
          margin: 0 0 1.5rem 0;
          max-width: 400px;
          line-height: 1.5;
        }
        #app-load-fallback button {
          background: #3b82f6;
          color: white;
          border: none;
          padding: 0.875rem 1.5rem;
          border-radius: 0.5rem;
          cursor: pointer;
          font-size: 1rem;
          font-weight: 500;
          display: flex;
          align-items: center;
          gap: 0.5rem;
          transition: background 0.2s, transform 0.1s;
        }
        #app-load-fallback button:hover {
          background: #2563eb;
        }
        #app-load-fallback button:active {
          transform: scale(0.98);
        }
        #app-load-fallback button:disabled {
          background: #64748b;
          cursor: not-allowed;
        }
        #app-load-fallback .fallback-hint {
          margin-top: 1.5rem;
          font-size: 0.875rem;
          opacity: 0.6;
        }
      </style>
      <div class="fallback-icon">⚠️</div>
      <h1>Failed to Load Application</h1>
      <p>There was a problem loading the app. This is usually caused by outdated cached files.</p>
      <button id="clear-cache-btn" onclick="clearCacheAndReload()">
        <span id="btn-icon">🔄</span>
        <span id="btn-text">Clear Cache and Reload</span>
      </button>
      <div class="fallback-hint">If the problem persists, try using incognito mode</div>
    </div>

    <script>
      // PRE-REACT DIAGNOSTICS - Runs before any modules load
      window.__REACT_MOUNTED__ = false;
      window.__BOOT_LOG__ = [];
      window.__BOOT_ERRORS__ = [];
      
      window.__logBoot__ = function(msg) {
        var entry = new Date().toISOString().split('T')[1] + ': ' + msg;
        window.__BOOT_LOG__.push(entry);
        console.log('[Boot]', msg);
      };
      
      window.__logBoot__('Script started');
      
      // Catch ALL errors including module loading failures
      window.addEventListener('error', function(e) {
        var errMsg = e.message || (e.error && e.error.message) || 'Unknown error';
        var errFile = e.filename || 'unknown';
        window.__BOOT_ERRORS__.push({ msg: errMsg, file: errFile, time: Date.now() });
        window.__logBoot__('ERROR: ' + errMsg);
        
        // Update fallback UI to show the actual error
        var hint = document.querySelector('.fallback-hint');
        if (hint && !window.__REACT_MOUNTED__) {
          hint.innerHTML = '<strong>Error:</strong> ' + errMsg + '<br><small>' + errFile + '</small>';
        }
        
        // Show fallback immediately on critical errors
        if (!window.__REACT_MOUNTED__ && (
          errMsg.includes('module') || 
          errMsg.includes('chunk') || 
          errMsg.includes('undefined')
        )) {
          document.getElementById('app-load-fallback').style.display = 'flex';
        }
      });
      
      // Catch unhandled promise rejections (module loading)
      window.addEventListener('unhandledrejection', function(e) {
        var errMsg = (e.reason && e.reason.message) || String(e.reason) || 'Promise rejected';
        window.__BOOT_ERRORS__.push({ msg: errMsg, type: 'promise', time: Date.now() });
        window.__logBoot__('PROMISE ERROR: ' + errMsg);
        
        var hint = document.querySelector('.fallback-hint');
        if (hint && !window.__REACT_MOUNTED__) {
          hint.innerHTML = '<strong>Load Error:</strong> ' + errMsg;
        }
      });
      
      // Show fallback if React doesn't mount within timeout
      window.addEventListener('load', function() {
        window.__logBoot__('Window loaded');
        setTimeout(function() {
          if (!window.__REACT_MOUNTED__) {
            console.warn('[Fallback UI] React did not mount within timeout');
            console.log('[Fallback UI] Boot log:', window.__BOOT_LOG__);
            console.log('[Fallback UI] Boot errors:', window.__BOOT_ERRORS__);
            document.getElementById('app-load-fallback').style.display = 'flex';
          }
        }, 8000); // 8 second timeout (reduced from 10)
      });
      
      // Clear cache and reload function
      async function clearCacheAndReload() {
        var btn = document.getElementById('clear-cache-btn');
        var btnIcon = document.getElementById('btn-icon');
        var btnText = document.getElementById('btn-text');
        
        btn.disabled = true;
        btnIcon.textContent = '⏳';
        btnText.textContent = 'Clearing cache...';
        
        try {
          if ('caches' in window) {
            var names = await caches.keys();
            await Promise.all(names.map(function(n) { return caches.delete(n); }));
            console.log('[Fallback UI] Cleared', names.length, 'caches');
          }
          if ('serviceWorker' in navigator) {
            var regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(function(r) { return r.unregister(); }));
            console.log('[Fallback UI] Unregistered', regs.length, 'service workers');
          }
          // Clear localStorage version to force fresh check
          try { localStorage.removeItem('app-version'); } catch(e) {}
          
          btnIcon.textContent = '✅';
          btnText.textContent = 'Reloading...';
        } catch (e) {
          console.error('[Fallback UI] Cache clear failed:', e);
          btnIcon.textContent = '⚠️';
          btnText.textContent = 'Reloading anyway...';
        }
        
        setTimeout(function() { window.location.reload(true); }, 500);
      }
    </script>

    <div id="root"></div>
    
    <!-- Preload main module -->
    <link rel="modulepreload" href="/src/main.tsx" />
    <script type="module" src="/src/main.tsx" onerror="window.__logBoot__('Main module failed to load')"></script>
  </body>
